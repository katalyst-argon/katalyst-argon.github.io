<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080a12" />
  <meta name="description" content="exo's songs — a personal music archive." />
  <title>exo — songs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080a12;
      --panel: rgba(17, 21, 36, 0.82);
      --panel-solid: #111524;
      --panel-hover: #171d31;
      --line: rgba(137, 157, 214, 0.16);
      --line-strong: rgba(137, 157, 214, 0.28);
      --text: #edf1ff;
      --muted: #8994b3;
      --faint: #5f6b8c;
      --accent: #8b7cff;
      --accent-2: #4dd6c0;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
    }
    *,* ::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      background: #050507;
      font-family: 'Manrope', system-ui, sans-serif;
    }
    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      inset: -18%;
      pointer-events: none;
      content: '';
    }
    body::before {
      background:
        radial-gradient(ellipse at 8% 10%, rgba(255, 74, 159, 0.72), transparent 30%),
        radial-gradient(ellipse at 88% 12%, rgba(149, 96, 255, 0.68), transparent 32%),
        radial-gradient(ellipse at 79% 80%, rgba(56, 211, 166, 0.3), transparent 25%),
        radial-gradient(ellipse at 42% 48%, rgba(255, 255, 255, 0.18), transparent 23%),
        linear-gradient(135deg, #050507 8%, #170b1d 35%, #070910 67%, #111019 100%);
      background-size: 145% 145%;
      filter: blur(18px);
      opacity: 0.9;
      animation: gradient-drift 22s ease-in-out infinite alternate;
    }
    body::after {
      background:
        radial-gradient(ellipse at 15% 72%, rgba(255, 125, 195, 0.28), transparent 22%),
        radial-gradient(ellipse at 70% 25%, rgba(184, 128, 255, 0.25), transparent 24%),
        radial-gradient(ellipse at 55% 92%, rgba(101, 232, 187, 0.16), transparent 20%);
      background-size: 170% 170%;
      filter: blur(70px);
      mix-blend-mode: screen;
      opacity: 0.7;
      animation: color-clouds 28s ease-in-out infinite alternate;
    }
    @keyframes gradient-drift {
      0% { background-position: 0% 20%; transform: scale(1) rotate(0deg); }
      50% { background-position: 100% 75%; transform: scale(1.08) rotate(2deg); }
      100% { background-position: 20% 100%; transform: scale(1.03) rotate(-2deg); }
    }
    @keyframes color-clouds {
      0% { background-position: 100% 0%; transform: translate3d(-4%, 2%, 0) scale(1); }
      50% { background-position: 0% 100%; transform: translate3d(5%, -3%, 0) scale(1.12); }
      100% { background-position: 70% 20%; transform: translate3d(-2%, 5%, 0) scale(1.06); }
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    .stars { display: none; }
    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 960px);
      margin: 0 auto;
      padding: 30px 0 150px;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 28px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: var(--accent);
      box-shadow: none;
    }
    .brand-mark svg { width: 18px; height: 18px; fill: #080a12; }
    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 17px;
      border-radius: 999px;
      transition: all 160ms ease;
    }
    .nav-link:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }
    .nav-link.active {
      color: var(--text);
      background: rgba(139, 124, 255, 0.14);
    }

    /* ---------- contact / inquiries panel ---------- */
    .contact {
      width: min(100%, 340px);
      padding: 13px 14px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(17, 21, 36, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.32);
    }
    .contact-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .contact-label {
      color: var(--accent-2);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .contact-toggle {
      display: grid;
      width: 22px;
      height: 22px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .contact-toggle:hover { color: var(--text); border-color: var(--line-strong); background: rgba(255, 255, 255, 0.06); }
    .contact-toggle svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms ease; }
    .contact.collapsed .contact-toggle svg { transform: rotate(-90deg); }
    .contact.collapsed .contact-body { display: none; }
    .contact-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .contact-link {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.022);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .contact-link:hover {
      color: var(--text);
      border-color: rgba(139, 124, 255, 0.55);
      background: var(--panel-hover);
      transform: translateY(-1px);
    }
    .contact-link.is-mail { grid-column: 1 / -1; }
    .contact-link.is-mail:hover { border-color: rgba(77, 214, 192, 0.55); }
    .contact-favicon {
      flex: none;
      display: grid;
      width: 18px;
      height: 18px;
      place-items: center;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.07);
    }
    .contact-favicon img { display: block; width: 14px; height: 14px; object-fit: contain; }
    .contact-favicon svg { width: 12px; height: 12px; fill: none; stroke: var(--accent-2); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .contact-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .contact-copy {
      flex: none;
      margin-left: auto;
      color: var(--faint);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    .contact-link:hover .contact-copy { opacity: 1; }

    /* ---------- view counter ---------- */
    .topbar-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      flex: none;
    }
    .views {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(17, 21, 36, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }
    .views-eye {
      flex: none;
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--accent-2);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .views-copy { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
    .views-label {
      color: var(--faint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .views-digits { display: flex; align-items: center; gap: 2px; }
    .views-digit {
      display: grid;
      min-width: 15px;
      height: 21px;
      padding: 0 2px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      background: rgba(5, 7, 13, 0.55);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .views-digit.is-sep {
      min-width: 0;
      border-color: transparent;
      color: var(--faint);
      background: transparent;
    }
    .views.is-loading .views-digit { color: var(--faint); animation: views-pulse 1.1s ease-in-out infinite; }
    .views.is-error .views-eye { stroke: #ff7d9d; }
    @keyframes views-pulse { 50% { opacity: 0.4; } }
    .views.bumped .views-digit { animation: views-bump 420ms ease; }
    @keyframes views-bump {
      40% { border-color: rgba(77, 214, 192, 0.7); transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(77, 214, 192, 0.1);
    }
    .status.is-loading .status-dot {
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .status.is-error .status-dot { background: #ff7d9d; }
    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.75); } }
    .hero { padding: 60px 0 42px; }
    h1 {
      max-width: 700px;
      margin: 0;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.3rem, 10vw, 6.2rem);
      font-weight: 600;
      letter-spacing: -0.085em;
      line-height: 0.92;
    }
    h1 span { color: var(--accent-2); }
    .library {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-solid);
      box-shadow: var(--shadow);
    }
    .library-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }
    .library-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: max-content;
    }
    .library-title h2 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }
    .count {
      color: var(--faint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
    }
    .search { position: relative; width: min(100%, 310px); }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 16px;
      height: 16px;
      color: var(--faint);
      pointer-events: none;
      transform: translateY(-50%);
    }
    .search input {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: rgba(5, 7, 13, 0.34);
      font-size: 13px;
      transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus {
      border-color: rgba(139, 124, 255, 0.8);
      background: rgba(5, 7, 13, 0.56);
      box-shadow: 0 0 0 4px rgba(139, 124, 255, 0.11);
    }
    .clear-search {
      position: absolute;
      top: 50%;
      right: 10px;
      display: grid;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      place-items: center;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 160ms ease, background 160ms ease, color 160ms ease;
    }
    .clear-search.visible { opacity: 1; pointer-events: auto; }
    .clear-search:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
    .track-list { display: grid; gap: 9px; padding: 12px; }
    .track {
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 80px;
      padding: 13px 16px 15px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.018);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }
    .track:hover { border-color: var(--line); background: var(--panel-hover); }
    .track.active { border-color: rgba(139, 124, 255, 0.62); background: #181c2b; }
    .track-number {
      align-self: center;
      color: var(--faint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .track.active .track-number { color: var(--accent-2); }
    .play-button, .now-play {
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .play-button { width: 38px; height: 38px; }
    .track:hover .play-button { border-color: rgba(139, 124, 255, 0.7); }
    .track.active .play-button, .play-button:hover {
      border-color: transparent;
      background: var(--accent);
      box-shadow: none;
    }
    .play-button svg { width: 15px; height: 15px; fill: currentColor; }
    .play-button .pause-svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .track-main { display: flex; align-items: center; min-width: 0; gap: 14px; }
    .track-info { min-width: 0; }
    .track-title {
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
    }
    .meta-dot { color: var(--faint); }
    .track-end { display: flex; align-items: center; gap: 15px; }
    .duration {
      min-width: 38px;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      text-align: right;
    }
    .download {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      text-decoration: none;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }
    .download:hover {
      border-color: rgba(77, 214, 192, 0.55);
      color: var(--accent-2);
      background: rgba(77, 214, 192, 0.08);
    }
    .download svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .track-progress {
      position: absolute;
      right: 16px;
      bottom: 7px;
      left: 16px;
      height: 2px;
      overflow: hidden;
      border-radius: 2px;
      background: rgba(137, 157, 214, 0.12);
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .track.active .track-progress { opacity: 1; }
    .track-fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .empty {
      padding: 72px 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }
    .empty strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 15px; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 20px 20px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
    }
    .now-playing {
      position: fixed;
      right: 20px;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      display: none;
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      border: 1px solid #30395d;
      border-radius: 10px;
      background: var(--panel-solid);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .now-playing.visible { display: block; animation: slide-up 220ms ease both; }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .now-inner {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
    }
    .now-artwork {
      display: grid;
      width: 72px;
      height: 72px;
      overflow: hidden;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--faint);
      background: #0b0e18;
    }
    .now-artwork svg { width: 25px; height: 25px; fill: currentColor; }
    .now-artwork img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .now-content { min-width: 0; }
    .now-copy { min-width: 0; }
    .now-label {
      margin-bottom: 4px;
      color: var(--accent-2);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .now-title {
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .now-meta { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .now-progress-wrap { margin-top: 10px; cursor: pointer; user-select: none; }
    .now-progress {
      position: relative;
      height: 4px;
      border-radius: 4px;
      background: rgba(137, 157, 214, 0.18);
      cursor: grab;
      touch-action: none;
    }
    .now-progress:active { cursor: grabbing; }
    .now-progress-fill {
      position: relative;
      width: 0;
      height: 100%;
      border-radius: 4px;
      background: var(--accent-2);
    }
    .now-progress-fill::after {
      position: absolute;
      top: 50%;
      right: -6px;
      width: 12px;
      height: 12px;
      border: 2px solid var(--panel-solid);
      border-radius: 50%;
      background: var(--accent-2);
      content: '';
      transform: translateY(-50%);
    }
    .now-times {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: var(--faint);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
    }
    .now-controls { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
    .player-control, .now-play {
      display: grid;
      width: 27px;
      height: 27px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      transition: color 160ms ease, background 160ms ease;
    }
    .player-control:hover, .player-control.is-active { color: var(--text); background: rgba(139, 124, 255, 0.14); }
    .player-control svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .now-play { width: 34px; height: 34px; color: #fff; background: var(--accent); }
    .now-play:hover { color: #fff; background: #9b8eff; }
    .now-play svg { width: 15px; height: 15px; fill: currentColor; }
    .now-play .pause-svg { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .volume-control { display: flex; align-items: center; gap: 5px; margin-left: 6px; }
    .volume-control input[type="range"] { width: 82px; height: 4px; accent-color: var(--accent-2); cursor: pointer; }
    .download-control { margin-left: auto; }
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 30;
      padding: 9px 16px;
      border: 1px solid rgba(77, 214, 192, 0.4);
      border-radius: 999px;
      color: var(--text);
      background: rgba(17, 21, 36, 0.92);
      backdrop-filter: blur(10px);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -12px);
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 650px) {
      .page { width: min(100% - 28px, 960px); padding-top: 20px; }
      .nav { flex-direction: column; gap: 14px; align-items: flex-start; }
      .nav-links { width: 100%; justify-content: flex-start; }

      .volume-control input[type="range"] { width: 58px; }
      .download-control { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,* ::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

  <section class="now-playing" id="nowPlaying" aria-label="Now playing">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.4v10.2a3.2 3.2 0 1 1-1.5-2.7V7.1l10-2.5v9.9a3.2 3.2 0 1 1-1.5-2.7V2.7L8.5 5.4Z"></path></svg>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="none"></audio>

  <script>
    /* ------------------------------------------------------------------
       contact / inquiries
    ------------------------------------------------------------------ */
    const CONTACTS = [
      { label: 'preference',     url: 'https://guns.lol/preference' },
      { label: 'portforward',    url: 'https://guns.lol/portforward' },
      { label: 'elijah8walker',  url: 'https://guns.lol/elijah8walker' },
      { label: '1runnersclub',   url: 'https://guns.lol/1runnersclub' },
      { label: '3jk',            url: 'https://guns.lol/3jk' },
      { label: 'ospec',          url: 'https://guns.lol/ospec' },
      { label: 'baited3@proton.me', url: 'mailto:baited3@proton.me', mail: true }
    ];
    const toast = document.getElementById('toast');
    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1600);
    }

    /* ------------------------------------------------------------------
       view counter
    ------------------------------------------------------------------ */
    // Change this to match your repo for the view counter to work properly
    const VIEW_NAMESPACE = 'YOUR_USERNAME/YOUR_REPO_NAME';
    const VIEW_KEY = 'exo-songs-views';
    const VIEW_SESSION_KEY = 'exo-view-counted';
    const VIEW_CACHE_KEY = 'exo-view-last';
    const viewsBox = document.createElement('div'); // hidden placeholder to keep JS working
    const viewsDigits = document.getElementById('viewsDigits') || document.createElement('div');

    const VIEW_ENDPOINTS = [
      {
        hit: `https://abacus.jasoncameron.dev/hit/${VIEW_NAMESPACE}/${VIEW_KEY}`,
        get: `https://abacus.jasoncameron.dev/get/${VIEW_NAMESPACE}/${VIEW_KEY}`
      },
      {
        hit: `https://countapi.mileshilliard.com/api/v1/hit/${VIEW_NAMESPACE.replace(/\W/g, '_')}_${VIEW_KEY.replace(/\W/g, '_')}`,
        get: `https://countapi.mileshilliard.com/api/v1/get/${VIEW_NAMESPACE.replace(/\W/g, '_')}_${VIEW_KEY.replace(/\W/g, '_')}`
      }
    ];

    function renderViews(total, animate) {
      const text = Number(total).toLocaleString('en-US');
      if (document.getElementById('viewsDigits')) {
        const digits = document.getElementById('viewsDigits');
        digits.replaceChildren();
        [...text].forEach(character => {
          const cell = document.createElement('span');
          cell.className = `views-digit${character === ',' ? ' is-sep' : ''}`;
          cell.textContent = character;
          digits.appendChild(cell);
        });
      }
    }

    function countUpTo(target) {
      const start = Number(sessionStorage.getItem(VIEW_CACHE_KEY)) || 0;
      const from = start && start < target && target - start < 400 ? start : Math.max(0, target - 24);
      const duration = 700;
      const began = performance.now();
      function step(now) {
        const progress = Math.min(1, (now - began) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        renderViews(Math.round(from + (target - from) * eased), false);
        if (progress < 1) requestAnimationFrame(step);
        else renderViews(target, true);
      }
      requestAnimationFrame(step);
    }

    async function readCount(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Counter returned ${response.status}`);
      const data = await response.json();
      const value = Number(data.value ?? data.count ?? data?.data?.up_count);
      if (!Number.isFinite(value)) throw new Error('Unexpected counter payload');
      return value;
    }

    async function loadViews() {
      const alreadyCounted = sessionStorage.getItem(VIEW_SESSION_KEY) === '1';
      for (const endpoint of VIEW_ENDPOINTS) {
        try {
          const total = await readCount(alreadyCounted ? endpoint.get : endpoint.hit);
          sessionStorage.setItem(VIEW_SESSION_KEY, '1');
          countUpTo(total);
          sessionStorage.setItem(VIEW_CACHE_KEY, String(total));
          localStorage.setItem(VIEW_CACHE_KEY, String(total));
          return;
        } catch (error) {
          console.warn('View counter endpoint failed:', endpoint.hit, error);
        }
      }
      const cached = Number(localStorage.getItem(VIEW_CACHE_KEY));
      if (Number.isFinite(cached) && cached > 0) {
        renderViews(cached, false);
      }
    }
    loadViews();

    /* ------------------------------------------------------------------
       library + player
    ------------------------------------------------------------------ */
    // ⚠️ IMPORTANT: Change this to YOUR GitHub username and repo name
    // Example: if your repo is https://github.com/exo/exo-songs
    // then use: const REPO = 'exo/exo-songs';
    const REPO = 'YOUR_USERNAME/YOUR_REPO_NAME';
    const BRANCH = 'main';
    const SONGS_PATH = 'Songs';
    const API_URL = `https://api.github.com/repos/${REPO}/contents/${SONGS_PATH}?ref=${BRANCH}`;
    const CACHE_KEY = `exo-song-list:${REPO}:${SONGS_PATH}`;
    const audio = document.getElementById('audio');
    const list = document.getElementById('trackList');
    const countEl = document.getElementById('count');
    const footerText = document.getElementById('footerText');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const nowPlaying = document.getElementById('nowPlaying');
    const nowTitle = document.getElementById('nowTitle');
    const nowMeta = document.getElementById('nowMeta');
    const nowPlay = document.getElementById('nowPlay');
    const nowProgressWrap = document.getElementById('nowProgressWrap');
    const nowProgress = nowProgressWrap ? nowProgressWrap.querySelector('.now-progress') : null;
    const nowProgressFill = document.getElementById('nowProgressFill');
    const nowCurrent = document.getElementById('nowCurrent');
    const nowTotal = document.getElementById('nowTotal');
    const nowArtwork = document.getElementById('nowArtwork');
    const nowDownload = document.getElementById('nowDownload');
    const previousButton = document.getElementById('prevSong');
    const nextButton = document.getElementById('nextSong');
    const loopButton = document.getElementById('loopSong');
    const volumeButton = document.getElementById('volumeButton');
    const volumeSlider = document.getElementById('volumeSlider');

    let songs = [];
    let currentSong = null;
    let searchTerm = '';
    let loopEnabled = false;
    let lastVolume = Number(volumeSlider ? volumeSlider.value : 0.85) || 0.85;
    let tagsLoader = null;

    if (audio) audio.volume = lastVolume;

    function escapeHTML(value) {
      return String(value).replace(/[&<> '"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '—:—';
      const minutes = Math.floor(seconds / 60);
      const remaining = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${minutes}:${remaining}`;
    }

    function playIcon() {
      return `<svg class="play-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"></path></svg>`;
    }
    function pauseIcon() {
      return `<svg class="pause-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg>`;
    }
    function setButtonIcon(button, playing) {
      if (!button) return;
      button.innerHTML = playing ? pauseIcon() : playIcon();
      button.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }

    function cachedSongs() {
      try {
        const value = JSON.parse(localStorage.getItem(CACHE_KEY));
        return Array.isArray(value) ? value : [];
      } catch (_) {
        return [];
      }
    }

    function saveSongs(value) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(value)); } catch (_) { /* storage is optional */ }
    }

    function filteredSongs() {
      const query = searchTerm.trim().toLocaleLowerCase();
      if (!query) return songs;
      return songs.filter(song => song.title.toLocaleLowerCase().includes(query));
    }

    function renderSongs() {
      if (!list || !countEl) return;
      const visible = filteredSongs();
      countEl.textContent = searchTerm.trim() ? `${visible.length} / ${songs.length}` : `${songs.length}`;
      if (clearSearch) clearSearch.classList.toggle('visible', Boolean(searchTerm));
      list.innerHTML = '';

      if (!visible.length) {
        list.innerHTML = songs.length
          ? `<div class="empty"><strong>No matching songs</strong>Try a different search term.</div>`
          : `<div class="empty"><strong>No songs yet</strong>Add MP3 files to the Songs folder to see them here.</div>`;
        return;
      }

      visible.forEach((song, index) => {
        const track = document.createElement('article');
        track.className = 'track';
        track.dataset.id = song.id;
        track.setAttribute('tabindex', '0');
        track.setAttribute('role', 'button');
        track.setAttribute('aria-label', `Play ${song.title}`);

        track.innerHTML = `
          <div class="track-number">${String(index + 1).padStart(2, '0')}</div>
          <div class="track-main">
            <button class="play-button" type="button" aria-label="Play ${escapeHTML(song.title)}">${playIcon()}</button>
            <div class="track-info">
              <div class="track-title">${escapeHTML(song.title)}</div>
              <div class="track-meta"><span>${escapeHTML(song.year || '2026')}</span><span class="meta-dot">•</span><span>MP3</span></div>
            </div>
          </div>
          <div class="track-end">
            <span class="duration">${song.duration ? formatTime(song.duration) : '—:—'}</span>
            <a class="download" href="${escapeHTML(song.url)}" download="${escapeHTML(song.title)}.mp3" title="Download ${escapeHTML(song.title)}" aria-label="Download ${escapeHTML(song.title)}">
              <svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 20h14"></path></svg>
            </a>
          </div>
          <div class="track-progress" aria-hidden="true"><div class="track-fill"></div></div>`;

        track.addEventListener('click', event => {
          if (event.target.closest('a')) return;
          playSong(song);
        });
        track.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            playSong(song);
          }
        });
        const playBtn = track.querySelector('.play-button');
        if (playBtn) playBtn.addEventListener('click', event => {
          event.stopPropagation();
          playSong(song);
        });
        const progress = track.querySelector('.track-progress');
        if (progress) progress.addEventListener('click', event => {
          event.stopPropagation();
          seekFrom(event, event.currentTarget);
        });
        list.appendChild(track);
      });
      updateTrackUI();
    }

    function updateTrackUI() {
      document.querySelectorAll('.track').forEach(track => {
        const active = currentSong && track.dataset.id === currentSong.id;
        track.classList.toggle('active', Boolean(active));
        const button = track.querySelector('.play-button');
        if (button) setButtonIcon(button, Boolean(active && !audio.paused));
      });
      if (nowPlay) setButtonIcon(nowPlay, Boolean(currentSong && !audio.paused));
    }

    const placeholderArtwork = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.4v10.2a3.2 3.2 0 1 1-1.5-2.7V7.1l10-2.5v9.9a3.2 3.2 0 1 1-1.5-2.7V2.7L8.5 5.4Z"></path></svg>`;

    function setArtwork(song) {
      if (!nowArtwork) return;
      nowArtwork.replaceChildren();
      if (!song.artwork) {
        nowArtwork.innerHTML = placeholderArtwork;
        return;
      }
      const image = new Image();
      image.alt = `${song.title} album artwork`;
      image.src = song.artwork;
      nowArtwork.appendChild(image);
    }

    function updateNowMeta(song) {
      if (!nowMeta) return;
      const details = [song.artist, song.album].filter(Boolean);
      nowMeta.textContent = details.length
        ? details.join('  •  ')
        : `${song.year || '2026'}  •  MP3`;
    }

    function loadTagReader() {
      if (window.jsmediatags) return Promise.resolve(window.jsmediatags);
      if (tagsLoader) return tagsLoader;
      tagsLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/jsmediatags@3.9.5/dist/jsmediatags.min.js';
        script.onload = () => window.jsmediatags ? resolve(window.jsmediatags) : reject(new Error('Tag reader unavailable'));
        script.onerror = reject;
        document.head.appendChild(script);
      });
      return tagsLoader;
    }

    function loadSongMetadata(song) {
      if (song.metadataLoaded || song.metadataLoading) return;
      song.metadataLoading = true;
      loadTagReader().then(reader => new Promise((resolve, reject) => {
        reader.read(song.url, { onSuccess: resolve, onError: reject });
      })).then(({ tags }) => {
        song.metadataLoading = false;
        song.metadataLoaded = true;
        song.artist = tags.artist || '';
        song.album = tags.album || '';
        song.year = tags.year || song.year;
        const picture = tags.picture;
        if (picture && picture.data && picture.data.length) {
          let binary = '';
          for (let index = 0; index < picture.data.length; index += 0x8000) {
            binary += String.fromCharCode(...picture.data.slice(index, index + 0x8000));
          }
          song.artwork = `data:${picture.format || 'image/jpeg'};base64,${btoa(binary)}`;
        }
        if (currentSong && currentSong.id === song.id) {
          updateNowMeta(song);
          setArtwork(song);
        }
      }).catch(() => {
        song.metadataLoading = false;
        song.metadataLoaded = true;
        if (currentSong && currentSong.id === song.id) updateNowMeta(song);
      });
    }

    function showNowPlaying(song) {
      if (!nowTitle || !nowMeta || !nowDownload || !nowPlaying) return;
      nowTitle.textContent = song.title;
      updateNowMeta(song);
      setArtwork(song);
      nowDownload.href = song.url;
      nowDownload.download = `${song.title}.mp3`;
      nowPlaying.classList.add('visible');
      if (nowCurrent) nowCurrent.textContent = '0:00';
      if (nowProgressFill) nowProgressFill.style.width = '0%';
      if (nowTotal) nowTotal.textContent = song.duration ? formatTime(song.duration) : '—:—';
      loadSongMetadata(song);
    }

    function playSong(song) {
      if (!audio) return;
      if (currentSong && currentSong.id === song.id) {
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
        return;
      }
      currentSong = song;
      audio.src = song.url;
      audio.load();
      showNowPlaying(song);
      updateTrackUI();
      audio.play().catch(() => {});
    }

    function seekFrom(event, element) {
      if (!currentSong || !Number.isFinite(audio.duration) || !nowProgressFill) return;
      const rect = element.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    }

    function updateProgress() {
      if (!currentSong || !Number.isFinite(audio.duration) || !nowProgressFill) return;
      const ratio = audio.currentTime / audio.duration;
      nowProgressFill.style.width = `${ratio * 100}%`;
      if (nowCurrent) nowCurrent.textContent = formatTime(audio.currentTime);
      if (nowTotal) nowTotal.textContent = formatTime(audio.duration);
      const track = [...document.querySelectorAll('.track')].find(item => item.dataset.id === currentSong.id);
      if (track) {
        const fill = track.querySelector('.track-fill');
        if (fill) fill.style.width = `${ratio * 100}%`;
      }
    }

    function updateCurrentDuration() {
      if (!currentSong || !Number.isFinite(audio.duration)) return;
      currentSong.duration = audio.duration;
      if (nowTotal) nowTotal.textContent = formatTime(audio.duration);
      const track = [...document.querySelectorAll('.track')].find(item => item.dataset.id === currentSong.id);
      if (track) {
        const dur = track.querySelector('.duration');
        if (dur) dur.textContent = formatTime(audio.duration);
      }
    }

    if (audio) {
      audio.addEventListener('loadedmetadata', updateCurrentDuration);
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('play', updateTrackUI);
      audio.addEventListener('pause', updateTrackUI);
      audio.addEventListener('error', () => {});
      audio.addEventListener('ended', () => {
        if (!currentSong) return;
        if (loopEnabled) {
          audio.currentTime = 0;
          audio.play().catch(() => {});
          return;
        }
        const currentPosition = songs.findIndex(song => song.id === currentSong.id);
        const next = songs[currentPosition + 1];
        if (next) playSong(next);
        else {
          audio.currentTime = 0;
          updateProgress();
        }
      });
    }

    function playAdjacent(direction) {
      if (!currentSong || !audio) return;
      if (direction < 0 && audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      const currentPosition = songs.findIndex(song => song.id === currentSong.id);
      const adjacent = songs[currentPosition + direction];
      if (adjacent) playSong(adjacent);
    }

    if (nowPlay) nowPlay.addEventListener('click', () => {
      if (!currentSong || !audio) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
    if (previousButton) previousButton.addEventListener('click', () => playAdjacent(-1));
    if (nextButton) nextButton.addEventListener('click', () => playAdjacent(1));
    if (loopButton) loopButton.addEventListener('click', () => {
      loopEnabled = !loopEnabled;
      loopButton.classList.toggle('is-active', loopEnabled);
      loopButton.setAttribute('aria-pressed', String(loopEnabled));
      loopButton.setAttribute('aria-label', loopEnabled ? 'Loop on' : 'Loop off');
    });
    if (volumeSlider) volumeSlider.addEventListener('input', () => {
      const value = Number(volumeSlider.value);
      if (audio) {
        audio.muted = value === 0;
        audio.volume = value;
        if (value > 0) lastVolume = value;
      }
      if (volumeButton) volumeButton.setAttribute('aria-label', (audio && audio.muted) ? 'Unmute' : 'Mute');
    });
    if (volumeButton) volumeButton.addEventListener('click', () => {
      if (!audio) return;
      if (audio.muted || audio.volume === 0) {
        audio.muted = false;
        audio.volume = lastVolume || 0.85;
        if (volumeSlider) volumeSlider.value = String(audio.volume);
        volumeButton.setAttribute('aria-label', 'Mute');
      } else {
        lastVolume = audio.volume;
        audio.muted = true;
        if (volumeSlider) volumeSlider.value = '0';
        volumeButton.setAttribute('aria-label', 'Unmute');
      }
    });

    let isSeeking = false;
    if (nowProgress) {
      nowProgress.addEventListener('click', event => seekFrom(event, nowProgress));
      nowProgress.addEventListener('pointerdown', event => {
        if (!currentSong || !Number.isFinite(audio.duration)) return;
        event.preventDefault();
        isSeeking = true;
        nowProgress.setPointerCapture?.(event.pointerId);
        seekFrom(event, nowProgress);
      });
      nowProgress.addEventListener('pointermove', event => {
        if (isSeeking) seekFrom(event, nowProgress);
      });
      nowProgress.addEventListener('pointerup', () => { isSeeking = false; });
      nowProgress.addEventListener('pointercancel', () => { isSeeking = false; });
    }
    if (nowProgressWrap) {
      nowProgressWrap.addEventListener('keydown', event => {
        if (!currentSong || !Number.isFinite(audio.duration)) return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + (event.key === 'ArrowRight' ? 5 : -5)));
        }
      });
    }

    if (searchInput) searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value;
      renderSongs();
    });
    if (clearSearch) clearSearch.addEventListener('click', () => {
      if (searchInput) searchInput.value = '';
      searchTerm = '';
      renderSongs();
      if (searchInput) searchInput.focus();
    });

    async function loadSongs() {
      const cached = cachedSongs();
      if (cached.length) {
        songs = cached;
        renderSongs();
      }
      try {
        const response = await fetch(API_URL, {
          headers: { Accept: 'application/vnd.github+json' },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const files = await response.json();
        if (!Array.isArray(files)) throw new Error('Unexpected GitHub response');

        songs = files
          .filter(file => file.type === 'file' && /\.mp3$/i.test(file.name))
          .map(file => ({
            id: file.sha || file.name,
            title: file.name.replace(/\.mp3$/i, ''),
            url: file.download_url || `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${SONGS_PATH}/${encodeURIComponent(file.name)}`,
            year: '2026'
          }))
          .sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));

        saveSongs(songs);
        renderSongs();
        if (footerText) footerText.textContent = `${songs.length} track${songs.length === 1 ? '' : 's'} · loaded from GitHub`;
      } catch (error) {
        console.error('Could not load songs:', error);
        if (songs.length) {
          if (footerText) footerText.textContent = `${songs.length} cached track${songs.length === 1 ? '' : 's'} · GitHub is unavailable`;
        } else {
          if (list) list.innerHTML = `<div class="empty"><strong>Could not load the library</strong>Check your connection and refresh the page.</div>`;
        }
      }
    }

    loadSongs();
  </script>
</body>
</html>
